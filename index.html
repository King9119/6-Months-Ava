<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Six Months Together Ava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Baby pink glow that grows from edges - subtle effect */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            animation: glowGrowth 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes glowGrowth {
            0% {
                background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            }
            100% {
                background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 192, 203, 0.15) 100%);
            }
        }

        /* Text that fades in - 4 seconds, then fades out - 2 seconds */
        .text {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInText 4s ease-in-out forwards, fadeOutText 2s ease-in-out 4s forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .text h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
        }

        /* Arrow and Heart Container */
        .arrow-heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 15;
        }

        /* Arrow wrapper */
        .arrow-wrapper {
            position: absolute;
            left: -350px;
            top: 50%;
            transform: translateY(-50%);
            animation: arrowShoot 1.5s ease-in 6.5s forwards;
            opacity: 0;
            z-index: 12;
        }

        /* Arrow shaft */
        .arrow-shaft {
            width: 300px;
            height: 14px;
            background-color: #FFB6C1;
            position: relative;
        }

        /* Arrow tip (heart emoji) */
        .arrow-tip {
            position: absolute;
            font-size: 40px;
            right: -36px;
            top: 50%;
            transform: translateY(-50%) rotateZ(-90deg);
        }

        @keyframes arrowShoot {
            0% {
                opacity: 1;
                left: -350px;
            }
            100% {
                opacity: 1;
                left: calc(50% - 150px);
            }
        }

        /* Heart emoji container */
        .heart-container {
            position: absolute;
            animation: heartAppear 0.5s ease-in-out 6s forwards;
            opacity: 0;
            z-index: 14;
        }

        @keyframes heartAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Heart emoji */
        .heart-emoji {
            font-size: 240px;
            line-height: 1;
        }

        /* Immediate tumble and fall animation on hit */
        .arrow-heart-container.hit {
            animation: immediateKnockAndTumble 5s ease-in 8s forwards !important;
        }

        @keyframes immediateKnockAndTumble {
            0% {
                transform: translateX(0) translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translateX(80px) translateY(800px) rotateZ(1800deg);
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .text h1 {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }
            .heart-emoji {
                font-size: 180px;
            }
            .arrow-shaft {
                width: 220px;
            }
            .arrow-tip {
                font-size: 30px;
            }
        }

        @media (max-width: 480px) {
            .text h1 {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
            .heart-emoji {
                font-size: 120px;
            }
            .arrow-shaft {
                width: 140px;
            }
            .arrow-tip {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="text">
            <h1>Happy Six Months Together Ava</h1>
        </div>
        <div class="arrow-heart-container">
            <div class="arrow-wrapper">
                <div class="arrow-shaft"></div>
                <div class="arrow-tip">❤️</div>
            </div>
            <div class="heart-container">
                <div class="heart-emoji">❤️</div>
            </div>
        </div>
    </div>

    <script>
        // Trigger heart and arrow hit animation after arrow hits at 8 seconds
        const container = document.querySelector('.arrow-heart-container');
        setTimeout(() => {
            container.classList.add('hit');
        }, 8000);
    </script>
</body>
</html>

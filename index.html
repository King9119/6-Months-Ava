<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Six Months Together Ava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Baby pink glow that grows from edges - subtle effect */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            animation: glowGrowth 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes glowGrowth {
            0% {
                background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            }
            100% {
                background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 192, 203, 0.15) 100%);
            }
        }

        /* Text that fades in - 4 seconds, then fades out - 2 seconds */
        .text {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInText 4s ease-in-out forwards, fadeOutText 2s ease-in-out 4s forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .text h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
        }

        /* Sound warning text */
        .sound-warning {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            animation: fadeInClickText 1s ease-in-out 8s forwards;
            opacity: 0;
            z-index: 25;
            pointer-events: none;
        }

        .sound-warning-text {
            color: #FFB6C1;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            letter-spacing: 1px;
        }

        .sound-warning.hidden {
            display: none;
        }

        /* The Main Heart and Arrow Container */
        .heart-arrow-wrapper {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 14;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* SINGLE arrow setup with updated width for perfect centering */
        .arrow-wrapper {
            position: absolute;
            left: -100vw; /* Hidden completely off-screen initially */
            top: 50%;
            transform: translateY(-50%);
            width: 360px; /* Lengthened slightly for better proportions */
            height: 14px;
            animation: arrowShoot 1.5s ease-in 6.5s forwards;
            opacity: 0;
            pointer-events: none;
            z-index: 11;
        }

        .arrow-shaft {
            width: 100%;
            height: 100%;
            background-color: #FFB6C1;
            position: relative;
        }

        .arrow-tip {
            position: absolute;
            font-size: 40px;
            right: -36px;
            top: 50%;
            transform: translateY(-50%) rotateZ(-90deg);
        }

        /* Adjusted landing position so both ends stick out exactly equal */
        @keyframes arrowShoot {
            0% {
                opacity: 1;
                left: -100vw;
            }
            100% {
                opacity: 1;
                left: -60px; /* Perfectly balances 60px sticking out on the left and right */
            }
        }

        /* Heart button styling */
        .heart-button-container {
            position: relative;
            animation: heartAppear 0.5s ease-in-out 6s forwards;
            opacity: 0;
            z-index: 14;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            pointer-events: none;
        }

        .heart-button-container.clickable {
            pointer-events: auto;
        }

        @keyframes heartAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .heart-emoji {
            font-size: 240px;
            line-height: 1;
            position: relative;
            z-index: 15;
        }

        /* Click me text */
        .click-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: fadeInClickText 1s ease-in-out 8s forwards;
            opacity: 0;
            z-index: 20;
            white-space: nowrap;
        }

        @keyframes fadeInClickText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .click-text-content {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            letter-spacing: 1px;
        }

        .click-text.hidden {
            display: none;
        }

        /* Falling/Tumbling animation on click */
        .heart-arrow-wrapper.tumble {
            animation: tumbleAndFall 5s ease-in forwards !important;
            pointer-events: none;
        }

        @keyframes tumbleAndFall {
            0% {
                transform: translate(-50%, -50%) translateX(0) translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) translateX(80px) translateY(800px) rotateZ(1800deg);
                opacity: 0;
            }
        }

        /* Responsive design adjustments for proportional centering */
        @media (max-width: 768px) {
            .text h1 {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }
            .heart-emoji {
                font-size: 180px;
            }
            .arrow-wrapper {
                width: 280px;
            }
            @keyframes arrowShoot {
                0% { opacity: 1; left: -100vw; }
                100% { opacity: 1; left: -50px; }
            }
            .click-text-content {
                font-size: 18px;
            }
            .sound-warning-text {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .text h1 {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
            .heart-emoji {
                font-size: 120px;
            }
            .arrow-wrapper {
                width: 200px;
                height: 10px;
            }
            @keyframes arrowShoot {
                0% { opacity: 1; left: -100vw; }
                100% { opacity: 1; left: -40px; }
            }
            .click-text-content {
                font-size: 14px;
            }
            .sound-warning-text {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        
        <div class="text">
            <h1>Happy Six Months Together Ava</h1>
        </div>
        
        <div class="sound-warning" id="soundWarning">
            <div class="sound-warning-text">Turn Sound On</div>
        </div>
        
        <div class="heart-arrow-wrapper" id="heartArrowWrapper">
            
            <div class="arrow-wrapper">
                <div class="arrow-shaft">
                    <div class="arrow-tip">❤️</div>
                </div>
            </div>

            <button class="heart-button-container" id="heartButton">
                <div class="heart-emoji">❤️</div>
                <div class="click-text" id="clickText">
                    <div class="click-text-content">Click Me ❤️</div>
                </div>
            </button>
            
        </div>
    </div>

    <audio id="heartMusic" src="https://raw.githubusercontent.com/King9119/6-Months-Ava/main/Music.mp3"></audio>

    <script>
        const heartButton = document.getElementById('heartButton');
        const heartArrowWrapper = document.getElementById('heartArrowWrapper');
        const heartMusic = document.getElementById('heartMusic');
        const soundWarning = document.getElementById('soundWarning');
        const clickText = document.getElementById('clickText');

        // Make button clickable at 8 seconds
        setTimeout(() => {
            heartButton.classList.add('clickable');
        }, 8000);

        heartButton.addEventListener('click', function() {
            heartArrowWrapper.classList.add('tumble');
            heartMusic.play();
            soundWarning.classList.add('hidden');
            clickText.classList.add('hidden');
        });
    </script>
</body>
</html>

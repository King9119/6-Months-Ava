        let currentScreenIndex = 0;

        // Make button interactive at exactly 8 seconds
        setTimeout(() => {
            heartButton.classList.add('clickable');
        }, 8000);

        heartButton.addEventListener('click', function() {
            heartArrowWrapper.classList.add('tumble');
            heartMusic.play().catch(err => console.log("Audio playback blocked:", err));
            
            soundWarning.classList.add('hidden');
            clickText.classList.add('hidden');
            
            setTimeout(() => {
                heartArrowWrapper.style.display = 'none';
                displayNextParagraph();
            }, 3000);
        });

        // Function to smoothly fade out the audio completely
        function fadeOutAudio(audioElement, durationMs) {
            const startVolume = audioElement.volume || 1.0;
            const intervalTime = 50; 
            const steps = durationMs / intervalTime;
            const volumeDecrease = startVolume / steps;
            
            const fadeInterval = setInterval(() => {
                if (audioElement.volume > volumeDecrease) {
                    audioElement.volume -= volumeDecrease;
                } else {
                    audioElement.volume = 0;
                    audioElement.pause();
                    clearInterval(fadeInterval);
                }
            }, intervalTime);
        }

        function displayNextParagraph() {
            if (currentScreenIndex < screens.length) {
                const currentText = screens[currentScreenIndex];
                
                // --- DYNAMIC FONT SIZER & STRUCTURE RECONSTRUCTION ---
                // Changes text sizing and column allocations structurally to ensure walls of text fit neatly inside the boundaries.
                if (currentText.length > 3000) { 
                    // Massive letters
                    flashDisplay.style.fontSize = "0.85rem";
                    flashDisplay.style.lineHeight = "1.35";
                    flashDisplay.style.columnCount = "1";
                } else if (currentText.length > 1500) { 
                    // Long letters and lists
                    flashDisplay.style.fontSize = "0.78rem";
                    flashDisplay.style.lineHeight = "1.35";
                    
                    // Splits the lists into a clean horizontal multi-column spread to prevent vertical overflows
                    if (currentScreenIndex === 5 || currentScreenIndex === 6) {
                        flashDisplay.style.columnCount = "3";
                    } else {
                        flashDisplay.style.columnCount = "2";
                    }
                } else { 
                    // Medium/Standard letters
                    flashDisplay.style.fontSize = "1.1rem";
                    flashDisplay.style.lineHeight = "1.5";
                    flashDisplay.style.columnCount = "1";
                }

                flashDisplay.innerHTML = currentText;
                flashDisplay.style.display = "block";
                
                setTimeout(() => {
                    flashDisplay.classList.add('visible');
                }, 50);

                // Timing engine: adjusts viewing length based on the character count 
                let readTime = (currentText.length > 1500) ? 14000 : 8500;

                setTimeout(() => {
                    flashDisplay.classList.remove('visible');
                    
                    setTimeout(() => {
                        flashDisplay.style.display = "none";
                        currentScreenIndex++;
                        displayNextParagraph();
                    }, 1500);

                }, readTime);

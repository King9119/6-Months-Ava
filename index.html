<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Six Months Together Ava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Baby pink glow that grows from edges - subtle effect */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            animation: glowGrowth 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes glowGrowth {
            0% {
                background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            }
            100% {
                background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 192, 203, 0.15) 100%);
            }
        }

        /* Text that fades in - 4 seconds, then fades out - 2 seconds */
        .text {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInText 4s ease-in-out forwards, fadeOutText 2s ease-in-out 4s forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .text h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
        }

        /* Heart container */
        .heart-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 15;
        }

        /* Pink heart */
        .heart {
            width: 80px;
            height: 80px;
            animation: heartAppear 0.5s ease-in-out 6s forwards;
            opacity: 0;
            position: relative;
        }

        @keyframes heartAppear {
            0% {
                opacity: 0;
                transform: scale(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Heart shape using SVG styling */
        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            background-color: #FFB6C1;
            border-radius: 50%;
        }

        .heart::before {
            width: 50px;
            height: 50px;
            left: 5px;
            top: 0;
        }

        .heart::after {
            width: 50px;
            height: 50px;
            right: 5px;
            top: 0;
        }

        .heart {
            position: relative;
        }

        .heart > div {
            position: absolute;
            width: 80px;
            height: 60px;
            background-color: #FFB6C1;
            clip-path: polygon(50% 100%, 0% 38%, 0% 0%, 38% 0%, 50% 24%, 62% 0%, 100% 0%, 100% 38%);
        }

        /* Arrow */
        .arrow {
            position: absolute;
            width: 40px;
            height: 8px;
            background-color: #FFB6C1;
            left: -100px;
            top: 50%;
            transform: translateY(-50%);
            animation: arrowShoot 1.5s ease-in 6.5s forwards;
            opacity: 0;
            z-index: 12;
        }

        .arrow::after {
            content: "";
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid #FFB6C1;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            right: -15px;
            top: 0;
        }

        @keyframes arrowShoot {
            0% {
                opacity: 1;
                left: -100px;
            }
            100% {
                opacity: 1;
                left: calc(50% - 60px);
            }
        }

        /* Heart knock back and roll down animation */
        .heart.hit {
            animation: heartAppear 0.5s ease-in-out 6s forwards, heartKnock 5s ease-in 8s forwards !important;
        }

        @keyframes heartKnock {
            0% {
                transform: translateX(0) translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            10% {
                transform: translateX(80px) translateY(0) rotateZ(0deg);
            }
            50% {
                transform: translateX(80px) translateY(200px) rotateZ(180deg);
                opacity: 1;
            }
            100% {
                transform: translateX(80px) translateY(800px) rotateZ(360deg);
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .text h1 {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }
            .heart {
                width: 60px;
                height: 60px;
            }
        }

        @media (max-width: 480px) {
            .text h1 {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
            .heart {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="text">
            <h1>Happy Six Months Together Ava</h1>
        </div>
        <div class="arrow"></div>
        <div class="heart-container">
            <div class="heart hit">
                <div></div>
            </div>
        </div>
    </div>

    <script>
        // Trigger heart hit animation after arrow hits at 8 seconds
        const heart = document.querySelector('.heart');
        setTimeout(() => {
            heart.classList.add('hit');
        }, 8000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Six Months Together Ava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Baby pink glow effect that grows from center outward */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(255, 192, 203, 0) 0%, rgba(255, 182, 193, 0) 100%);
            animation: glowGrowth 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes glowGrowth {
            0% {
                background: radial-gradient(ellipse at center, rgba(255, 192, 203, 0) 0%, rgba(255, 182, 193, 0) 100%);
            }
            100% {
                background: radial-gradient(ellipse at center, rgba(255, 192, 203, 0.5) 0%, rgba(255, 182, 193, 0.3) 100%);
            }
        }

        /* Text that fades in at same time as pink glow - 4 seconds */
        .text {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .text h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .text h1 {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }
        }

        @media (max-width: 480px) {
            .text h1 {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="text">
            <h1>Happy Six Months Together Ava</h1>
        </div>
    </div>
</body>
</html>

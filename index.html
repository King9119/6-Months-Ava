<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Six Months Together Ava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: #000000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Baby pink glow that grows from edges - subtle effect */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            animation: glowGrowth 4s ease-in-out forwards;
            pointer-events: none;
        }

        @keyframes glowGrowth {
            0% {
                background: radial-gradient(ellipse at center, transparent 30%, rgba(255, 192, 203, 0) 70%);
            }
            100% {
                background: radial-gradient(ellipse at center, transparent 20%, rgba(255, 192, 203, 0.15) 100%);
            }
        }

        /* Text that fades in - 4 seconds, then fades out - 2 seconds */
        .text {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInText 4s ease-in-out forwards, fadeOutText 2s ease-in-out 4s forwards;
            opacity: 0;
        }

        @keyframes fadeInText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeOutText {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }

        .text h1 {
            font-size: 4rem;
            color: #ffffff;
            font-weight: 300;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 192, 203, 0.6);
        }

        /* Arrow shooting */
        .arrow-wrapper {
            position: absolute;
            left: -350px;
            top: 50%;
            transform: translateY(-50%);
            animation: arrowShoot 1.5s ease-in 6.5s forwards;
            opacity: 0;
            z-index: 12;
            pointer-events: none;
        }

        /* Arrow shaft */
        .arrow-shaft {
            width: 300px;
            height: 14px;
            background-color: #FFB6C1;
            position: relative;
        }

        /* Arrow tip (heart emoji) */
        .arrow-tip {
            position: absolute;
            font-size: 40px;
            right: -36px;
            top: 50%;
            transform: translateY(-50%) rotateZ(-90deg);
        }

        @keyframes arrowShoot {
            0% {
                opacity: 1;
                left: -350px;
            }
            100% {
                opacity: 1;
                left: calc(50% - 150px);
            }
        }

        /* Heart button container */
        .heart-button-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: heartAppear 0.5s ease-in-out 6s forwards;
            opacity: 0;
            z-index: 14;
            cursor: pointer;
            border: none;
            background: none;
            padding: 0;
            pointer-events: none;
        }

        .heart-button-container.clickable {
            pointer-events: auto;
        }

        @keyframes heartAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* Heart emoji */
        .heart-emoji {
            font-size: 240px;
            line-height: 1;
        }

        /* Click me text */
        .click-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            animation: fadeInClickText 1s ease-in-out 8s forwards;
            opacity: 0;
            z-index: 20;
            white-space: nowrap;
        }

        @keyframes fadeInClickText {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        .click-text-content {
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255, 192, 203, 0.8);
            letter-spacing: 1px;
        }

        /* Arrow overlay on heart - only appears after click */
        .arrow-overlay {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 16;
            opacity: 0;
        }

        .arrow-overlay-shaft {
            width: 300px;
            height: 14px;
            background-color: #FFB6C1;
            position: relative;
        }

        .arrow-overlay-tip {
            position: absolute;
            font-size: 40px;
            right: -36px;
            top: 50%;
            transform: translateY(-50%) rotateZ(-90deg);
        }

        /* Show arrow overlay and hide click text on tumble */
        .heart-button-container.tumble .arrow-overlay {
            opacity: 1;
        }

        .heart-button-container.tumble .click-text {
            display: none;
        }

        /* Tumble and fall animation */
        .heart-button-container.tumble {
            animation: tumbleAndFall 5s ease-in forwards !important;
            pointer-events: none;
        }

        @keyframes tumbleAndFall {
            0% {
                transform: translate(-50%, -50%) translateX(0) translateY(0) rotateZ(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) translateX(80px) translateY(800px) rotateZ(1800deg);
                opacity: 0;
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .text h1 {
                font-size: 2.5rem;
                letter-spacing: 1px;
            }
            .heart-emoji {
                font-size: 180px;
            }
            .arrow-overlay-shaft {
                width: 220px;
            }
            .arrow-overlay-tip {
                font-size: 30px;
            }
            .click-text-content {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .text h1 {
                font-size: 1.8rem;
                letter-spacing: 0.5px;
            }
            .heart-emoji {
                font-size: 120px;
            }
            .arrow-overlay-shaft {
                width: 140px;
            }
            .arrow-overlay-tip {
                font-size: 24px;
            }
            .click-text-content {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glow"></div>
        <div class="text">
            <h1>Happy Six Months Together Ava</h1>
        </div>
        <div class="arrow-wrapper">
            <div class="arrow-shaft"></div>
            <div class="arrow-tip">❤️</div>
        </div>
        <button class="heart-button-container" id="heartButton">
            <div class="heart-emoji">❤️</div>
            <div class="arrow-overlay">
                <div class="arrow-overlay-shaft"></div>
                <div class="arrow-overlay-tip">❤️</div>
            </div>
            <div class="click-text">
                <div class="click-text-content">Click Me ❤️</div>
            </div>
        </button>
    </div>

    <audio id="heartMusic" src="https://raw.githubusercontent.com/King9119/6-Months-Ava/main/Music.mp3"></audio>

    <script>
        const heartButton = document.getElementById('heartButton');
        const heartMusic = document.getElementById('heartMusic');

        // Make button clickable at 8 seconds
        setTimeout(() => {
            heartButton.classList.add('clickable');
        }, 8000);

        heartButton.addEventListener('click', function() {
            heartButton.classList.add('tumble');
            heartMusic.play();
        });
    </script>
</body>
</html>
